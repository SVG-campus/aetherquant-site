<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherQuant Quantitative API Portal | Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0E14;
            color: #F8FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
        }
        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #00f2fe;
            text-align: center;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #94A3B8;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #CBD5E0;
            margin-bottom: 0.4rem;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: #FFFFFF;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #00f2fe;
        }
        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            background: #00f2fe;
            color: #000000;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: opacity 0.2s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        .badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            font-size: 0.75rem;
            color: #00f2fe;
            margin-bottom: 1rem;
            width: 100%;
            text-align: center;
        }
        .msg-box {
            margin-top: 1rem;
            font-size: 0.85rem;
            text-align: center;
            color: #10B981;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-title">AetherQuant Quantitative API Portal</div>
        <div class="subtitle">Enter your credentials to access your developer portal</div>
        <div class="badge">PROMO CODE TESTING: Use 'FREEPASS' for Enterprise Tier ($499/mo)</div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" value="test_admin@aetherquant.cloud" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" value="EminencePass2026!" required>
            </div>
            <button type="submit" class="submit-btn">Sign In to Dashboard</button>
        </form>

        <div class="msg-box" id="msg-box"></div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msg = document.getElementById('msg-box');
            msg.style.display = 'block';
            msg.innerText = "Authentication Successful! Redirecting to " + email + " portal...";
            setTimeout(() => {
                window.location.href = "index.html";
            }, 1200);
        }
    </script>
</body>
</html>
