<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherQuant | Auth0 Unified Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0E14;
            color: #F8FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            text-align: center;
        }
        .brand-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #00f2fe;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #94A3B8;
            margin-bottom: 1.8rem;
        }
        .auth0-btn {
            width: 100%;
            padding: 0.85rem;
            background: #00f2fe;
            color: #000000;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: opacity 0.2s;
        }
        .auth0-btn:hover {
            opacity: 0.9;
        }
        .badge {
            display: inline-block;
            padding: 0.3rem 0.6rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            font-size: 0.75rem;
            color: #00f2fe;
            margin-bottom: 1.2rem;
            width: 100%;
        }
        .switch-link {
            display: block;
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: #94A3B8;
            text-decoration: none;
        }
        .switch-link:hover {
            color: #00f2fe;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-title">AetherQuant Portal</div>
        <div class="subtitle">Secure Single Sign-On powered by Auth0 Cloud</div>
        <div class="badge">AUTH0 TENANT: eminencecore.us.auth0.com</div>

        <button class="auth0-btn" onclick="loginWithAuth0()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
            Sign In / Register with Auth0
        </button>

        <a href="index.html" class="switch-link">← Back to Main Website</a>
    </div>

    <script>
        let auth0Client = null;

        async function initAuth0() {
            try {
                auth0Client = await auth0.createAuth0Client({
                    domain: "eminencecore.us.auth0.com",
                    clientId: "12ZdllQtLrC6a6LSqrx7sjgd6KkQtuMU",
                    authorizationParams: {
                        redirect_uri: window.location.origin + window.location.pathname
                    }
                });
                
                // Handle callback
                if (window.location.search.includes("code=") && window.location.search.includes("state=")) {
                    await auth0Client.handleRedirectCallback();
                    const user = await auth0Client.getUser();
                    localStorage.setItem("aetherquant_auth0_user", JSON.stringify(user));
                    window.location.href = "index.html#dashboard";
                }
            } catch(e) {
                console.warn("Auth0 init fallback", e);
            }
        }

        async function loginWithAuth0() {
            if (!auth0Client) await initAuth0();
            if (auth0Client) {
                await auth0Client.loginWithRedirect();
            } else {
                alert("Redirecting to Auth0 Universal Login...");
            }
        }

        window.onload = initAuth0;
    </script>
</body>
</html>
