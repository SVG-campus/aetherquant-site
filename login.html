<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Sign in | AetherQuant</title>
  <style>body{margin:0;background:#0b0e14;color:#f8fafc;font:16px Inter,system-ui,sans-serif;display:grid;min-height:100vh;place-items:center;padding:24px}main{max-width:460px;width:100%;box-sizing:border-box;padding:40px;border:1px solid #243244;border-radius:20px;background:#111827}p{color:#a8b4c5;line-height:1.55}button{width:100%;border:0;border-radius:10px;padding:15px;background:#57e5d1;color:#06121a;font-weight:800;font-size:16px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#a8b4c5}#status{margin-top:16px;color:#a8b4c5}</style>
</head><body><main>
  <a href="/" aria-label="Return to AetherQuant home">← AetherQuant</a>
  <h1>Welcome back</h1><p>Sign in or create an account to open your causal market intelligence.</p>
  <button id="sign-in" disabled>Continue securely</button><p id="status" role="status" hidden></p>
  <p>By continuing, you agree to the service terms and privacy notice.</p>
</main>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
    <script>
      const authConfig = { domain: "eminencecore.us.auth0.com", clientId: "12ZdllQtLrC6a6LSqrx7sjgd6KkQtuMU" };
      let auth0Client;
      const params = new URLSearchParams(window.location.search);
      const status = document.getElementById('status');
      const setStatus = (message) => { status.textContent = message; status.hidden = !message; };
      async function startLogin() {
        setStatus('Redirecting to secure sign in…');
        await auth0Client.loginWithRedirect({ authorizationParams: { redirect_uri: `${window.location.origin}/login.html` }, appState: { returnTo: '/dashboard' } });
      }
      async function initAuth() {
        try {
          auth0Client = await auth0.createAuth0Client({ ...authConfig, authorizationParams: { redirect_uri: `${window.location.origin}/login.html` } });
          if (params.has('code') && params.has('state')) {
            const result = await auth0Client.handleRedirectCallback();
            window.location.replace(result.appState?.returnTo || '/dashboard');
            return;
          }
          if (await auth0Client.isAuthenticated()) { window.location.replace('/dashboard'); return; }
          document.getElementById('sign-in').disabled = false;
        } catch (error) {
          console.error('Authentication initialization failed', error);
          setStatus('We could not start secure sign in. Please try again or contact support.');
        }
      }
      document.getElementById('sign-in').addEventListener('click', startLogin);
      initAuth();
    </script></body></html>
